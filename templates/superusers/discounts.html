{% extends "superusers/base.html" %}

{% block content %}
<section class="min-h-screen px-6 py-10">
  <h1 class="text-3xl font-semibold mb-6">Discounts</h1>

  <div class="space-y-4">
    {% for discount in discounts %}
      <div class="border p-4">
        {{ discount }}
      </div>
    {% empty %}
      <p>No discounts found.</p>
    {% endfor %}
  </div>
</section>
{% endblock %}
