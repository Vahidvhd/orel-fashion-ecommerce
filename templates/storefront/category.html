{% extends "base.html" %}
{% block title %}{{ section_label }} — {{ brand_name }}{% endblock %}

{% block content %}
<div class="pt-24 pb-16 min-h-screen">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <header class="mb-10">
      <h1 class="font-serif text-4xl capitalize">{{ section_label }}</h1>
      <p class="mt-2 text-brand-muted text-sm">
        {{ page_obj.paginator.count|default:products|length }} styles
      </p>
    </header>

    <div id="category-content">
      {% include "storefront/partials/category_content.html" %}
    </div>
  </div>
</div>
{% endblock %}
